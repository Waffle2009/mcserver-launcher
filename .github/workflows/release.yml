name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0)"
        required: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish app
        run: >
          dotnet publish App/McServerLauncher.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -o publish-win-x64

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Pack Velopack release
        run: >
          vpk pack
          --packId McServerLauncher
          --packVersion ${{ steps.version.outputs.version }}
          --packDir publish-win-x64
          --mainExe McServerLauncher.exe
          --packAuthors Waffle2009
          --packTitle "MC Server Launcher"
          -o Releases

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: Releases/*
          generate_release_notes: true
